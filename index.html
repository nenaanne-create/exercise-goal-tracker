<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: top bar with tabs (bottom bar on phones); each tab is one column of cards, max 760px. */
:root {
  --bg: #eef1f2;
  --surface: #ffffff;
  --ink: #000000;
  --muted: #000000;
  --line: #d6dde2;
  --accent: #0b6e8a;
  --accent-ink: #ffffff;
  --soft: #e3ecef;
  /* colour-blind-safe set (Okabe–Ito based): no red or green, each colour differs in hue and lightness */
  --good: #1a5fb4;
  --bad: #b54d00;
  --a-ride: #0072b2;
  --a-paddle: #56b4e9;
  --a-river: #9b6fd0;
  --a-run: #e69f00;
  --a-walk: #7a4a1e;
  --a-swim: #f0e442;
  --a-gym: #cc79a7;
  --a-other: #9e9e9e;
  --a-amber: #ca8a04;
  --a-olive: #000000;
  --goal: #ff6d00;
  --shadow: 0 1px 2px rgba(15,30,40,.07), 0 3px 10px rgba(15,30,40,.05);
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --a-river: #c7a6f0;
    --bg: #11171c; --surface: #19222a; --ink: #e5ebef; --muted: #e5ebef; --line: #2b3741;
    --accent: #45b4d3; --accent-ink: #0a1418; --soft: #1f2c35; --good: #7cb7ff; --bad: #ff9d5c;
    --a-ride: #4a90e2; --a-paddle: #9ad7fa; --a-run: #f5a623; --a-walk: #b07a45; --a-swim: #f7ec6e; --a-gym: #e7a3c8; --a-other: #a8a8a8; --a-amber: #facc15; --a-olive: #f3f4f6; --goal: #ff8a3d;
    --shadow: 0 1px 2px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --a-river: #c7a6f0;
  --bg: #11171c; --surface: #19222a; --ink: #e5ebef; --muted: #e5ebef; --line: #2b3741;
  --accent: #45b4d3; --accent-ink: #0a1418; --soft: #1f2c35; --good: #7cb7ff; --bad: #ff9d5c;
  --a-ride: #4a90e2; --a-paddle: #9ad7fa; --a-run: #f5a623; --a-walk: #b07a45; --a-swim: #f7ec6e; --a-gym: #e7a3c8; --a-other: #a8a8a8; --a-amber: #facc15; --a-olive: #f3f4f6; --goal: #ff8a3d;
  --shadow: 0 1px 2px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 0.9375rem/1.45 var(--f-body); padding-bottom: 72px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.topin { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { font: 700 1.375rem/1 var(--f-display); letter-spacing: .01em; margin: 0; text-transform: uppercase; }
.status { font-size: 0.8125rem; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; margin-left: auto; }
nav.tabs a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.875rem; padding: 7px 11px; border-radius: 6px; }
nav.tabs a[aria-current="page"] { color: var(--accent); background: var(--soft); }
@media (max-width: 620px) {
  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); margin: 0; justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 6; }
  nav.tabs a { font-size: 0.8125rem; padding: 8px 2px; flex: 1; text-align: center; }
}
main { max-width: 760px; margin: 0 auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { font: 700 1.0625rem/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; text-wrap: balance; }
.card h2 .right { margin-left: auto; font: 500 0.8125rem var(--f-body); text-transform: none; letter-spacing: 0; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 0.8125rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 10px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 560px) { .g4 { grid-template-columns: 1fr 1fr; } }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 8px 14px; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 0.8125rem; }
.btn:disabled { opacity: .5; cursor: default; }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 0.8125rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 8px 10px; width: 100%; }
.field textarea { min-height: 44px; resize: vertical; }
.hint { font-size: 0.8125rem; color: var(--muted); }
.err { color: var(--bad); font-size: 0.8125rem; min-height: 0; }

.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.acts.editing .act { border-style: dashed; }
.acts.editing .act .x { margin-left: 4px; color: var(--bad); font-weight: 700; }
.acts.editing .act.locked { opacity: .45; }
.act { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 0.875rem; display: inline-flex; align-items: center; gap: 6px; }
.act[aria-pressed="true"] { background: var(--ac); border-color: var(--ac); color: var(--aci, #fff); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ac); flex: none; display: inline-block; }
.act[aria-pressed="true"] .dot { background: var(--aci, #fff); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-weight: 600; font-size: 0.8125rem; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.tile { background: var(--soft); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .k { font-size: 0.8125rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tile .v { font: 700 1.625rem/1.05 var(--f-display); font-variant-numeric: tabular-nums; }
.tile .v small { font: 600 0.875rem var(--f-body); color: var(--muted); margin-left: 2px; }
.tile .s { font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.day { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.day:first-child { border-top: 0; padding-top: 0; }
.dayhead { display: flex; align-items: baseline; gap: 8px; }
.dayhead b { font-weight: 600; }
.dayhead .tot { margin-left: auto; font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.entry { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--bg); border: 0; text-align: left; width: 100%; border-left: 4px solid var(--ac); }
.entry .name { font-weight: 600; }
.entry .note { font-size: 0.8125rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fbar { display: flex; flex-direction: column; gap: 10px; background: var(--bg); border-radius: 10px; padding: 10px; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-weight: 600; font-size: 0.8125rem; display: inline-flex; align-items: center; gap: 6px; }
.fchip .dot { width: 9px; height: 9px; }
.fchip[aria-pressed="true"] { background: var(--ac, var(--accent)); border-color: var(--ac, var(--accent)); color: #fff; }
.fchip[aria-pressed="true"] .dot { background: #fff; }
.fgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fgrid .field select, .fgrid .field input { width: 100%; min-width: 0; }
@media (max-width: 480px) { .fgrid { grid-template-columns: 1fr 1fr; } }
.fsum { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 0.875rem; }
.entry .srate { color: #e0a800; font-size: 0.875rem; letter-spacing: 1px; line-height: 1.2; }
.stars { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.stars .star { border: 0; background: transparent; font-size: 1.875rem; line-height: 1; padding: 2px 3px; color: #d1d5db; }
.stars .star.on { color: #f5b800; text-shadow: 0 1px 2px rgba(180,120,0,.35); }
.stars .hint { margin-left: 8px; }
.entry .nums { text-align: right; font-variant-numeric: tabular-nums; font-size: 0.875rem; }
.entry .nums .p { font-size: 0.8125rem; color: var(--muted); }
.entry[disabled] { cursor: default; }

table.t { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.t th { text-align: right; font-size: 0.8125rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--line); }
table.t tr.total td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--line); }
table.t tr.me td { background: var(--soft); }
.tablewrap { overflow-x: auto; }

.bar { height: 10px; background: var(--soft); border-radius: 5px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ac, var(--accent)); border-radius: 5px; }
.bar.stack { display: flex; }
.bar.stack > span { border-radius: 0; flex: none; }
.bar.stack > span:first-child { border-radius: 5px 0 0 5px; }
.dhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.dbig { font: 700 2.125rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.dbig small { font: 600 0.875rem var(--f-body); color: var(--muted); }
.dstate { margin-left: auto; font-weight: 600; color: var(--muted); }
.dstate.ok { color: var(--good); }
.dbar { position: relative; height: 18px; background: var(--soft); border-radius: 9px; margin: 14px 0 2px; }
.dfill { display: flex; height: 100%; border-radius: 9px; overflow: hidden; }
.dfill > span { flex: none; height: 100%; }
.dbar.hit { box-shadow: 0 0 0 2px var(--good); }
.dmark { position: absolute; top: -6px; bottom: -6px; width: 0; border-left: 2px dashed var(--ink); }
.dmark span { position: absolute; top: -1.3rem; left: 0; transform: translateX(-50%); font-size: 0.8125rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
.week { display: grid; grid-template-columns: auto repeat(7, minmax(0, 1fr)); gap: 4px; }
.waxis { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding: 4px 0; border: 1px solid transparent; min-width: 2.4rem; }
.axtube { position: relative; width: 100%; height: 4.5rem; border-right: 1px solid var(--line); }
.axtube .tick { position: absolute; right: 5px; transform: translateY(50%); font-size: 0.8125rem; line-height: 1; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.axtube .tick.tgt { color: var(--ink); font-weight: 600; }
.axtube .tick::after { content: ""; position: absolute; right: -6px; top: 50%; width: 4px; border-top: 1px solid var(--line); }
.waxis .wval { min-height: 1.1rem; font-size: 0.8125rem; }
.waxis .wlbl, .waxis .wdate { font-size: 0.8125rem; color: var(--muted); font-weight: 600; }
.wday { border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wday.sel { border-color: var(--accent); background: var(--soft); }
.wday.future { opacity: .45; cursor: default; }
.wday .wval { font-size: 0.8125rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.1rem; }
.wday.hit .wval { color: var(--good); font-size: 0.8125rem; }
.wday .wlbl { font-size: 0.8125rem; font-weight: 600; line-height: 1.1; }
.wday .wdate { font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.1; }
.wday.sel .wdate { color: var(--ink); }
.tube { position: relative; width: 22px; height: 4.5rem; background: var(--soft); border-radius: 6px; overflow: hidden; }
.tfill { position: absolute; left: 0; right: 0; bottom: 0; top: 0; display: flex; flex-direction: column-reverse; }
.tfill > span { flex: none; width: 100%; }
.tube.pair { isolation: isolate; width: min(32px, 100%); background: transparent; border-bottom: 1px solid var(--line); border-radius: 0; overflow: visible; }
.tube.pair::before { content: ""; position: absolute; inset: 0; background: var(--soft); border-radius: 5px 5px 0 0; z-index: -1; }
.pbar { position: absolute; bottom: 0; width: 13px; border-radius: 3px 3px 0 0; }
.pbar.pact { left: 2px; background: var(--a-other); display: flex; flex-direction: column-reverse; overflow: hidden; }
.pbar.pact > span { flex: none; width: 100%; }
.pbar.pwgt { right: 2px; background: var(--goal); background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.28) 0 3px, transparent 3px 7px); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8125rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw2 { display: inline-block; width: 12px; height: 10px; border-radius: 2px; }
.sw2.sact { background: linear-gradient(var(--a-ride) 0 50%, var(--a-paddle) 50%); }
.sw2.swgt { background: var(--goal); background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.35) 0 2px, transparent 2px 5px); }
.sw2.line { height: 0; border-top: 2px dashed var(--ink); width: 14px; border-radius: 0; }
.tmark { position: absolute; left: -2px; right: -2px; height: 0; border-top: 2px dashed var(--ink); opacity: .7; }
.seg.wrap { display: flex; flex-wrap: wrap; }
.seg.wrap button { flex: 1 1 auto; }
.pnav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.plabel { font-weight: 600; min-width: 150px; text-align: center; font-variant-numeric: tabular-nums; }
.pjump { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
.pjump input { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 5px 8px; }
.pnav .pjump + .pjump { margin-left: 0; }
.act.edit { border-style: dashed; color: var(--muted); background: transparent; font-weight: 500; }
.types { display: flex; flex-direction: column; }
.trow2 { display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.trow2:first-child { border-top: 0; }
.trow2.hid b { color: var(--muted); }
.trow2.hid .cbtn { opacity: .45; }
.addtype { background: var(--soft); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.tact { display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
.tact .mv { min-width: 34px; padding-left: 8px; padding-right: 8px; font-size: 1rem; }
.tact .mv:disabled { opacity: .3; }
@media (max-width: 480px) { .trow2 { grid-template-columns: auto 1fr auto; } .trow2 > :nth-child(4) { display: none; } }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches.inline { padding: 4px 0 10px 26px; }
.cbtn { width: 18px; height: 18px; border-radius: 50%; background: var(--ac); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.cbtn:hover, .cbtn[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--ink); }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.apptag { display: inline-block; margin-left: 6px; font-size: 0.8125rem; font-weight: 700; letter-spacing: .03em; color: #fff; background: #d0021b; border-radius: 3px; padding: 0 5px; vertical-align: 2px; }
.pnum { width: 74px; border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 3px 4px; font-size: 0.8125rem; text-align: right; }
.pdate { border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 3px 4px; font-size: 0.8125rem; }
.dup.warnt { color: var(--a-run); }
tr.duprow td { background: color-mix(in srgb, var(--a-run) 10%, var(--surface)); }
tr.duprow.ticked td { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); }
.dupmsg { font-size: 0.8125rem; font-weight: 600; color: var(--a-run); }
tr.duprow.ticked .dupmsg { color: var(--bad); }
.dupof { display: block; font-weight: 400; color: var(--muted); white-space: normal; }
.celebrate { position: fixed; inset: 0; z-index: 50; background: rgba(10, 18, 24, .55); display: flex; align-items: center; justify-content: center; padding: 20px; animation: cfade .2s ease-out; }
.cbox { position: relative; background: var(--surface); color: var(--ink); border-radius: 18px; padding: 22px 20px 18px; width: min(340px, 100%); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.35); display: flex; flex-direction: column; align-items: center; gap: 8px; animation: cpop .45s cubic-bezier(.2,1.4,.4,1); }
.medal { width: 104px; height: 130px; margin-top: -60px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.25)); animation: cswing 1.6s ease-in-out .3s 2; transform-origin: 50% 0; }
.medal .spark { animation: ctwinkle 1s ease-in-out infinite alternate; transform-origin: center; }
.ctitle { font: 700 2rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; margin: 4px 0 0; color: var(--good); }
.cline { margin: 0; font-weight: 600; font-size: 1rem; }
.cstats { display: flex; gap: 8px; justify-content: center; width: 100%; margin-top: 4px; }
.cstats > div { flex: 1; background: var(--soft); border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; }
.cstats b { font: 700 1.5rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.cstats b.plus { color: var(--good); }
.cstats span { font-size: 0.8125rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.streakb { font-weight: 700; padding: 6px 14px; border-radius: 999px; background: color-mix(in srgb, var(--a-run) 16%, var(--surface)); color: var(--a-run); }
.streakb.gold { background: linear-gradient(135deg, #fff3b0, #f5c542 55%, #d9a514); color: #5a3d00; box-shadow: 0 2px 10px rgba(245,197,66,.5); }
.btn.big { padding: 11px 36px; font-size: 1.0625rem; margin-top: 6px; border-radius: 999px; }
.snd { position: absolute; top: 10px; right: 10px; border: 0; background: var(--soft); border-radius: 50%; width: 36px; height: 36px; font-size: 1.0625rem; }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 60; pointer-events: none; }
@keyframes cpop { from { transform: scale(.6) translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes cfade { from { opacity: 0; } to { opacity: 1; } }
@keyframes cswing { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(6deg); } 75% { transform: rotate(-6deg); } }
@keyframes ctwinkle { from { opacity: .3; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .cbox, .medal, .medal .spark, .celebrate { animation: none !important; } }
.basis { margin: -4px 0 0; font-size: 0.8125rem; color: var(--muted); }
.basis b { color: var(--good); font-weight: 600; }
.wtag { margin-left: 8px; font-size: 0.8125rem; font-weight: 600; color: var(--good); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; vertical-align: 1px; }
.picprev { width: 100%; max-width: 360px; border-radius: 12px; box-shadow: var(--shadow); align-self: center; }
a.btn { text-decoration: none; display: inline-block; }

    }
    main.append(sc);

    const lc = h("div", { class: "card" }, h("h2", null, "Matching days", h("span", { class: "right" }, q ? `${rows.length} for “${F.q.trim()}”` : `${rows.length}`)));
    if (!rows.length) lc.append(h("div", { class: "empty" }, "No days match these filters."));
    else {
      const lim = ui.dShow || 60;
      const listEl = h("div", { class: "dlist" });
      for (const r of [...rows].reverse().slice(0, lim)) {
        let detail = "", act = null;
        if (r.status === "exercised") { const tot = totals(r.sessions, r.date, r.date);
          detail = [r.sessions.map((s, i) => [i ? ", " : "", s.activity, s.rating ? h("span", { class: "rstars", style: "margin-left:4px", "aria-label": `${s.rating} of 5 stars` }, starTxt(s.rating)) : null]), ` · ${fmtKm(tot.km)} km · ${fmtDuration(tot.min)}`]; }
        else if (r.status === "excused") { detail = reasonLabel(r.reason); if (canWrite) act = h("button", { class: "btn sm", type: "button", onclick: () => { openExcuse(r.date, true); render(); window.scrollTo({ top: 0, behavior: "smooth" }); } }, "Edit"); }
        else { detail = "Nothing logged"; if (canWrite && r.date >= addDays(t, -EX_BACKFILL)) act = h("button", { class: "btn sm", type: "button", onclick: () => { openExcuse(r.date, false); location.hash = "#log"; } }, "Excuse this day"); }
        listEl.append(h("div", { class: "drow" }, h("b", null, fmtDay(r.date)), statusPill(r),
          h("span", null, detail, r.note ? h("div", { class: "note" }, r.note) : null), act || h("span")));
      }
      lc.append(listEl);
      if (rows.length > lim) lc.append(h("button", { class: "btn", type: "button", onclick: () => { ui.dShow = lim + 60; render(); } }, `Show more (${rows.length - lim})`));
    }
    main.append(lc);
  }

  // ---------- routing & start ----------
  const VIEWS = ["log", "stats", "days", "goals", "import"];
  function fromHash() { const v = location.hash.replace("#", "") === "settings" ? "goals" : location.hash.replace("#", ""); return VIEWS.includes(v) ? v : "log"; }
  window.addEventListener("hashchange", () => { const v = fromHash(); if (v !== view) { view = v; render(); window.scrollTo(0, 0); } });
  view = fromHash();
  render();

  async function start() {
    if (!window.claude || typeof window.claude.use !== "function") { setStatus("Open this app on claude.ai to use it."); render(); return; }
    try { user = await window.claude.use("user"); } catch { user = null; }
    if (user) {
      try { me = await user.id(); } catch { me = null; }
      if (me) { try { const p = await user.me(); if (p && p.name) names.set(me, p.name); } catch {} }
      try { const c = await Promise.resolve(user.can("data.write")); if (c === false) canWrite = false; } catch {}
    }
    try { db = await window.claude.use("db"); } catch { db = null; }
    try {
      sampleFn = await window.claude.use("sample");
      const caps = sampleFn ? await sampleFn.limits().catch(() => null) : null;
      shotTypes = caps && caps.images ? caps.images.mediaTypes : null;
    } catch { sampleFn = null; shotTypes = null; }
    if (!db) { setStatus("Sign in to claude.ai to use this app."); render(); return; }
    if (!me) { canWrite = false; }
    setStatus("Loading…");
    readyTimer = setTimeout(() => { if (!ready) setStatus("Can't reach your data yet. It will load when the connection recovers."); }, 10000);
    if (me) subscribeMember(me); else { ready = true; }
    if (window.STANDALONE && me) {
      // Everyone in the standalone app starts with the 15 goal km daily target (added once; they can change or remove it).
      (async () => {
        try {
          const ref = db.doc(`sessions/${me}`); const snap = await ref.get();
          if (!snap.exists) await ensureMyDoc();
          else {
            const d = snap.data() || {}; let goals = Array.isArray(d.goals) ? d.goals.slice() : [];
            if (!d.weeklyDefaulted) {
              goals = goals.filter(g => !(g && g.id === "daily15")); // the automatic 15-a-day target is replaced by 15 a week
              if (!goals.some(g => g && (g.period === "week" || g.period === "day"))) goals.push({ id: "weekly15", activity: "All", metric: "wkm", period: "week", target: 15 });
              await ref.update({ dailyDefaulted: true, weeklyDefaulted: true, goals });
            }
          }
        } catch {}
      })();
    }
    db.collection("sessions").limit(MAX_MEMBERS).onSnapshot((snap) => {
      for (const d of snap.docs) { subscribeMember(d.id); const m = members.get(d.id); if (m) m.doc = d.data() || {}; }
      if (!me && !snap.metadata.fromCache) markReady();
      scheduleRender();
    }, () => { setStatus("Lost the connection. Reload the page to reconnect."); });
    render();
  }
  start();
})();
</script>
</body>
</html>
