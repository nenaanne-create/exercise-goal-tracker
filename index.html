<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: top bar with tabs (bottom bar on phones); each tab is one column of cards, max 760px. */
:root {
  --bg: #eef1f2;
  --surface: #ffffff;
  --ink: #17212b;
  --muted: #5b6874;
  --line: #d6dde2;
  --accent: #0b6e8a;
  --accent-ink: #ffffff;
  --soft: #e3ecef;
  --good: #2e7d4f;
  --bad: #c0392b;
  --a-ride: #2563eb;
  --a-paddle: #0891b2;
  --a-run: #ea580c;
  --a-walk: #8b5a2b;
  --a-swim: #7c3aed;
  --a-gym: #c026d3;
  --a-other: #6b7280;
  --a-amber: #ca8a04;
  --a-indigo: #1e3a8a;
  --a-red: #dc2626;
  --a-olive: #111827;
  --a-pink: #ec4899;
  --shadow: 0 1px 2px rgba(15,30,40,.07), 0 3px 10px rgba(15,30,40,.05);
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171c; --surface: #19222a; --ink: #e5ebef; --muted: #98a6b1; --line: #2b3741;
    --accent: #45b4d3; --accent-ink: #0a1418; --soft: #1f2c35; --good: #5cc08a; --bad: #ef6f62;
    --a-ride: #60a5fa; --a-paddle: #22d3ee; --a-run: #fb923c; --a-walk: #c08a5a; --a-swim: #a78bfa; --a-gym: #e879f9; --a-other: #9ca3af; --a-amber: #facc15; --a-indigo: #818cf8; --a-red: #f87171; --a-olive: #f3f4f6; --a-pink: #f9a8d4;
    --shadow: 0 1px 2px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171c; --surface: #19222a; --ink: #e5ebef; --muted: #98a6b1; --line: #2b3741;
  --accent: #45b4d3; --accent-ink: #0a1418; --soft: #1f2c35; --good: #5cc08a; --bad: #ef6f62;
  --a-ride: #60a5fa; --a-paddle: #22d3ee; --a-run: #fb923c; --a-walk: #c08a5a; --a-swim: #a78bfa; --a-gym: #e879f9; --a-other: #9ca3af; --a-amber: #facc15; --a-indigo: #818cf8; --a-red: #f87171; --a-olive: #f3f4f6; --a-pink: #f9a8d4;
  --shadow: 0 1px 2px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); padding-bottom: 72px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.topin { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { font: 700 22px/1 var(--f-display); letter-spacing: .01em; margin: 0; text-transform: uppercase; }
.status { font-size: 12px; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; margin-left: auto; }
nav.tabs a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; padding: 7px 11px; border-radius: 6px; }
nav.tabs a[aria-current="page"] { color: var(--accent); background: var(--soft); }
@media (max-width: 620px) {
  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); margin: 0; justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 6; }
  nav.tabs a { font-size: 13px; padding: 8px 6px; flex: 1; text-align: center; }
}
main { max-width: 760px; margin: 0 auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { font: 700 17px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; text-wrap: balance; }
.card h2 .right { margin-left: auto; font: 500 13px var(--f-body); text-transform: none; letter-spacing: 0; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 10px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 560px) { .g4 { grid-template-columns: 1fr 1fr; } }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 8px 14px; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 8px 10px; width: 100%; }
.field textarea { min-height: 44px; resize: vertical; }
.hint { font-size: 12px; color: var(--muted); }
.err { color: var(--bad); font-size: 13px; min-height: 0; }

.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.act { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.act[aria-pressed="true"] { background: var(--ac); border-color: var(--ac); color: #fff; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ac); flex: none; display: inline-block; }
.act[aria-pressed="true"] .dot { background: #fff; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-weight: 600; font-size: 13px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.tile { background: var(--soft); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .k { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tile .v { font: 700 26px/1.05 var(--f-display); font-variant-numeric: tabular-nums; }
.tile .v small { font: 600 14px var(--f-body); color: var(--muted); margin-left: 2px; }
.tile .s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.day { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.day:first-child { border-top: 0; padding-top: 0; }
.dayhead { display: flex; align-items: baseline; gap: 8px; }
.dayhead b { font-weight: 600; }
.dayhead .tot { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.entry { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--bg); border: 0; text-align: left; width: 100%; border-left: 4px solid var(--ac); }
.entry .name { font-weight: 600; }
.entry .note { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry .nums { text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
.entry .nums .p { font-size: 12px; color: var(--muted); }
.entry[disabled] { cursor: default; }

table.t { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.t th { text-align: right; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--line); }
table.t tr.total td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--line); }
table.t tr.me td { background: var(--soft); }
.tablewrap { overflow-x: auto; }

.bar { height: 10px; background: var(--soft); border-radius: 5px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ac, var(--accent)); border-radius: 5px; }
.bar.stack { display: flex; }
.bar.stack > span { border-radius: 0; flex: none; }
.bar.stack > span:first-child { border-radius: 5px 0 0 5px; }
.dhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.dbig { font: 700 34px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.dbig small { font: 600 14px var(--f-body); color: var(--muted); }
.dstate { margin-left: auto; font-weight: 600; color: var(--muted); }
.dstate.ok { color: var(--good); }
.dbar { position: relative; height: 18px; background: var(--soft); border-radius: 9px; margin: 14px 0 2px; }
.dfill { display: flex; height: 100%; border-radius: 9px; overflow: hidden; }
.dfill > span { flex: none; height: 100%; }
.dbar.hit { box-shadow: 0 0 0 2px var(--good); }
.dmark { position: absolute; top: -6px; bottom: -6px; width: 0; border-left: 2px dashed var(--ink); }
.dmark span { position: absolute; top: -16px; left: 0; transform: translateX(-50%); font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.week { display: grid; grid-template-columns: auto repeat(7, 1fr); gap: 6px; }
.waxis { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding: 4px 0; border: 1px solid transparent; min-width: 30px; }
.axtube { position: relative; width: 100%; height: 64px; border-right: 1px solid var(--line); }
.axtube .tick { position: absolute; right: 5px; transform: translateY(50%); font-size: 10px; line-height: 1; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.axtube .tick.tgt { color: var(--ink); font-weight: 600; }
.axtube .tick::after { content: ""; position: absolute; right: -6px; top: 50%; width: 4px; border-top: 1px solid var(--line); }
.waxis .wval { min-height: 15px; font-size: 11px; }
.waxis .wlbl, .waxis .wdate { font-size: 10px; color: var(--muted); font-weight: 600; }
.wday { border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wday.sel { border-color: var(--accent); background: var(--soft); }
.wday.future { opacity: .45; cursor: default; }
.wday .wval { font-size: 11px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 15px; }
.wday.hit .wval { color: var(--good); font-size: 13px; }
.wday .wlbl { font-size: 12px; font-weight: 600; line-height: 1.1; }
.wday .wdate { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.1; }
.wday.sel .wdate { color: var(--ink); }
.tube { position: relative; width: 22px; height: 64px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.tfill { position: absolute; left: 0; right: 0; bottom: 0; top: 0; display: flex; flex-direction: column-reverse; }
.tfill > span { flex: none; width: 100%; }
.tube.pair { isolation: isolate; width: 32px; background: transparent; border-bottom: 1px solid var(--line); border-radius: 0; overflow: visible; }
.tube.pair::before { content: ""; position: absolute; inset: 0; background: var(--soft); border-radius: 5px 5px 0 0; z-index: -1; }
.pbar { position: absolute; bottom: 0; width: 13px; border-radius: 3px 3px 0 0; }
.pbar.pact { left: 2px; background: var(--a-other); display: flex; flex-direction: column-reverse; overflow: hidden; }
.pbar.pact > span { flex: none; width: 100%; }
.pbar.pwgt { right: 2px; background: var(--good); background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.28) 0 3px, transparent 3px 7px); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw2 { display: inline-block; width: 12px; height: 10px; border-radius: 2px; }
.sw2.sact { background: linear-gradient(var(--a-ride) 0 50%, var(--a-paddle) 50%); }
.sw2.swgt { background: var(--good); background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.35) 0 2px, transparent 2px 5px); }
.sw2.line { height: 0; border-top: 2px dashed var(--ink); width: 14px; border-radius: 0; }
.tmark { position: absolute; left: -2px; right: -2px; height: 0; border-top: 2px dashed var(--ink); opacity: .7; }
.seg.wrap { display: flex; flex-wrap: wrap; }
.seg.wrap button { flex: 1 1 auto; }
.pnav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.plabel { font-weight: 600; min-width: 150px; text-align: center; font-variant-numeric: tabular-nums; }
.pjump { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
.pjump input { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 5px 8px; }
.pnav .pjump + .pjump { margin-left: 0; }
.act.edit { border-style: dashed; color: var(--muted); background: transparent; font-weight: 500; }
.types { display: flex; flex-direction: column; }
.trow2 { display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.trow2:first-child { border-top: 0; }
@media (max-width: 480px) { .trow2 { grid-template-columns: auto 1fr auto; } .trow2 > :nth-child(4) { display: none; } }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches.inline { padding: 4px 0 10px 26px; }
.cbtn { width: 18px; height: 18px; border-radius: 50%; background: var(--ac); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.cbtn:hover, .cbtn[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--ink); }
.act[aria-pressed="true"] { text-shadow: 0 0 2px rgba(0,0,0,.55); }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.apptag { display: inline-block; margin-left: 6px; font-size: 10px; font-weight: 700; letter-spacing: .03em; color: #fff; background: #d0021b; border-radius: 3px; padding: 0 5px; vertical-align: 2px; }
.pnum { width: 74px; border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 3px 4px; font-size: 13px; text-align: right; }
.pdate { border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 3px 4px; font-size: 13px; }
.dup.warnt { color: var(--a-run); }
tr.duprow td { background: color-mix(in srgb, var(--a-run) 10%, var(--surface)); }
tr.duprow.ticked td { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); }
.dupmsg { font-size: 12px; font-weight: 600; color: var(--a-run); }
tr.duprow.ticked .dupmsg { color: var(--bad); }
.dupof { display: block; font-weight: 400; color: var(--muted); white-space: normal; }
.celebrate { position: fixed; inset: 0; z-index: 50; background: rgba(10, 18, 24, .55); display: flex; align-items: center; justify-content: center; padding: 20px; animation: cfade .2s ease-out; }
.cbox { position: relative; background: var(--surface); color: var(--ink); border-radius: 18px; padding: 22px 20px 18px; width: min(340px, 100%); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.35); display: flex; flex-direction: column; align-items: center; gap: 8px; animation: cpop .45s cubic-bezier(.2,1.4,.4,1); }
.medal { width: 104px; height: 130px; margin-top: -60px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.25)); animation: cswing 1.6s ease-in-out .3s 2; transform-origin: 50% 0; }
.medal .spark { animation: ctwinkle 1s ease-in-out infinite alternate; transform-origin: center; }
.ctitle { font: 700 32px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; margin: 4px 0 0; color: var(--good); }
.cline { margin: 0; font-weight: 600; font-size: 16px; }
.cstats { display: flex; gap: 8px; justify-content: center; width: 100%; margin-top: 4px; }
.cstats > div { flex: 1; background: var(--soft); border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; }
.cstats b { font: 700 24px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.cstats b.plus { color: var(--good); }
.cstats span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.streakb { font-weight: 700; padding: 6px 14px; border-radius: 999px; background: color-mix(in srgb, var(--a-run) 16%, var(--surface)); color: var(--a-run); }
.streakb.gold { background: linear-gradient(135deg, #fff3b0, #f5c542 55%, #d9a514); color: #5a3d00; box-shadow: 0 2px 10px rgba(245,197,66,.5); }
.btn.big { padding: 11px 36px; font-size: 17px; margin-top: 6px; border-radius: 999px; }
.snd { position: absolute; top: 10px; right: 10px; border: 0; background: var(--soft); border-radius: 50%; width: 36px; height: 36px; font-size: 17px; }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 60; pointer-events: none; }
@keyframes cpop { from { transform: scale(.6) translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes cfade { from { opacity: 0; } to { opacity: 1; } }
@keyframes cswing { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(6deg); } 75% { transform: rotate(-6deg); } }
@keyframes ctwinkle { from { opacity: .3; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .cbox, .medal, .medal .spark, .celebrate { animation: none !important; } }
.basis { margin: -4px 0 0; font-size: 13px; color: var(--muted); }
.basis b { color: var(--good); font-weight: 600; }
.wtag { margin-left: 8px; font-size: 11px; font-weight: 600; color: var(--good); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; vertical-align: 1px; }
.nudge { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(420px, calc(100% - 24px)); z-index: 40; background: var(--surface); border-radius: 14px; box-shadow: 0 10px 34px rgba(0,0,0,.25); border-top: 4px solid var(--good); padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 7px; animation: nup .35s cubic-bezier(.2,1.2,.4,1); }
.nudge.out { opacity: 0; transform: translate(-50%, 16px); transition: all .25s; }
@media (min-width: 621px) { .nudge { bottom: 24px; } }
.ntitle { font: 700 20px/1.15 var(--f-display); padding-right: 28px; }
.nsub { font-size: 13px; color: var(--muted); }
.nbar { height: 8px; } .nbar > span { background: var(--good); }
.nsugg { font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
.nsugg .nlbl { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.npace { font-size: 13px; color: var(--muted); }
.nclose { position: absolute; top: 6px; right: 8px; border: 0; background: transparent; font-size: 22px; color: var(--muted); width: 32px; height: 32px; }
@keyframes nup { from { opacity: 0; transform: translate(-50%, 30px); } to { opacity: 1; transform: translate(-50%, 0); } }
@media (prefers-reduced-motion: reduce) { .nudge { animation: none; } }
.notice.warn { background: color-mix(in srgb, var(--a-run) 14%, var(--surface)); color: var(--ink); }
.cond { font-size: 11px; font-weight: 600; color: var(--accent); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; margin-left: 8px; vertical-align: 1px; }
.breakdown { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.wgrid .field input { padding: 6px 8px; }
.goal { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.goal:first-of-type { border-top: 0; }
.goal .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.goal .top b { font-weight: 600; }
.goal .top .num { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 14px; }
.goal.done .num { color: var(--good); font-weight: 600; }

.chartbox { position: relative; height: 260px; }
.empty { text-align: center; color: var(--muted); padding: 22px 8px; }
.notice { background: var(--soft); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--muted); }
.preview td input[type=checkbox] { width: 18px; height: 18px; }
.preview td select { border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 3px 4px; }
.dup { color: var(--muted); font-size: 12px; }
.rank { font: 700 18px var(--f-display); color: var(--muted); width: 26px; display: inline-block; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div>
      <h1>Exercise Tracker</h1>
      <div class="status" id="status">Connecting…</div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#log" data-view="log">Log</a>
      <a href="#stats" data-view="stats">Stats</a>
      <a href="#goals" data-view="goals">Goals</a>
      <a href="#import" data-view="import">Import</a>
    </nav>
  </div>
</header>
<main id="main"></main>

<script id="lib">
/* Pure helpers: dates, durations, parsing. No DOM, no storage. */
(function (root) {
  const ACTIVITIES = ["Ride", "Paddle", "Run", "Walk", "Swim", "Gym", "Other"];
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseYmd = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
  const isYmd = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseYmd(s));
  function weekStart(s) { const d = parseYmd(s); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return ymd(d); } // Monday
  const monthStart = (s) => s.slice(0, 8) + "01";
  const yearStart = (s) => s.slice(0, 5) + "01-01";
  function periodRange(kind, today) {
    if (kind === "day") return [today, today];
    if (kind === "week") { const a = weekStart(today); return [a, addDays(a, 6)]; }
    if (kind === "month") { const a = monthStart(today); const d = parseYmd(a); d.setMonth(d.getMonth() + 1); d.setDate(0); return [a, ymd(d)]; }
    if (kind === "year") return [yearStart(today), today.slice(0, 4) + "-12-31"];
    return ["0000-01-01", "9999-12-31"];
  }
  function parseDuration(v) {
    if (v == null) return null; const s = String(v).trim().toLowerCase(); if (!s) return null;
    let m;
    if ((m = s.match(/^(\d+):(\d{1,2}):(\d{1,2})$/))) return +m[1] * 60 + +m[2] + +m[3] / 60;
    if ((m = s.match(/^(\d+):(\d{1,2})$/))) return +m[1] * 60 + +m[2];
    // h.mm with a dot (easier on a phone keypad): 1.25 = 1h 25m, 1.2 = 1h 20m, 0.45 = 45m
    if ((m = s.match(/^(\d*)[.,](\d{1,2})$/))) { const mm = m[2].length === 1 ? +m[2] * 10 : +m[2]; return mm > 59 ? NaN : (+m[1] || 0) * 60 + mm; }
    if ((m = s.match(/^(?:(\d+(?:\.\d+)?)\s*h(?:ours?|rs?)?)?\s*(?:(\d+(?:\.\d+)?)\s*m(?:in(?:utes?|s)?)?)?$/)) && (m[1] || m[2])) return (+m[1] || 0) * 60 + (+m[2] || 0);
    if (/^\d+(\.\d+)?$/.test(s)) return +s;
    return NaN;
  }
  function fmtDuration(min) {
    if (min == null || !isFinite(min)) return "–";
    const t = Math.round(min); const h = Math.floor(t / 60), m = t % 60;
    return h ? `${h}h ${pad(m)}m` : `${m}m`;
  }
  const fmtKm = (km) => (km == null || !isFinite(km) ? "–" : km >= 100 ? km.toFixed(0) : km.toFixed(1));
  function pace(activity, km, min) {
    if (!km || !min || km <= 0 || min <= 0) return "";
    if (activity === "Run" || activity === "Walk") { const p = min / km; const mm = Math.floor(p), ss = Math.round((p - mm) * 60); return `${mm}:${pad(ss === 60 ? 59 : ss)} /km`; }
    if (activity === "Swim") return `${fmtDuration((min / km) / 10).replace("m", "")}m /100m`;
    return `${(km / (min / 60)).toFixed(1)} km/h`;
  }
  function mapActivity(s) {
    const t = String(s || "").toLowerCase();
    if (/bike|ride|cycl|mtb|biking|spin/.test(t)) return "Ride";
    if (/kayak|paddl|canoe|\bsup\b|stand.?up|row|surfski|outrigger/.test(t)) return "Paddle";
    if (/run|jog|sprint/.test(t)) return "Run";
    if (/walk|hike|hiking|trek|stroll/.test(t)) return "Walk";
    if (/swim/.test(t)) return "Swim";
    if (/gym|weight|strength|yoga|pilates|crossfit|circuit|lift/.test(t)) return "Gym";
    return "Other";
  }
  const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };
  function parseDateLoose(s, slashOrder) {
    if (s == null) return null; let t = String(s).trim(); if (!t) return null;
    let m;
    if ((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
    if ((m = t.match(/^([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})/))) { const mo = MONTHS[m[1].toLowerCase().slice(0, 4)] || MONTHS[m[1].toLowerCase().slice(0, 3)]; if (mo) return `${m[3]}-${pad(mo)}-${pad(m[2])}`; }
    if ((m = t.match(/^(\d{1,2})\s+([A-Za-z]{3,9})\.?,?\s+(\d{4})/))) { const mo = MONTHS[m[2].toLowerCase().slice(0, 4)] || MONTHS[m[2].toLowerCase().slice(0, 3)]; if (mo) return `${m[3]}-${pad(mo)}-${pad(m[1])}`; }
    if ((m = t.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/))) {
      let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000;
      let mo, d;
      if (a > 12) { d = a; mo = b; } else if (b > 12) { mo = a; d = b; } else if (slashOrder === "dmy") { d = a; mo = b; } else { mo = a; d = b; }
      if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) return `${y}-${pad(mo)}-${pad(d)}`;

  function parseCSV(text) {
    const rows = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
      else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }

    }

  function num(s) { if (s == null) return null; const n = parseFloat(String(s).replace(/,/g, "").trim()); return isFinite(n) ? n : null; }

  function parseWorkoutCSV(text, slashOrder) {
    const all = parseCSV(text.replace(/^﻿/, "")); const warnings = [];
    if (all.length < 2) return { rows: [], warnings: ["The file has no workout rows."] };
    const head = all[0].map(h => h.trim().toLowerCase());
    const find = (...res) => { for (const re of res) { const i = head.findIndex(h => re.test(h)); if (i >= 0) return i; } return -1; };
    const iDate = find(/^workout date/, /^date$/, /start.*(date|time)/, /date/);
    const iAct = find(/activity type/, /^activity/, /^type$/, /sport/);
    const iDist = find(/^distance/, /distance/);
    const iSec = find(/time \(seconds\)/, /duration \(s/, /seconds/);
    const iDur = iSec >= 0 ? -1 : find(/workout time/, /duration/, /moving time/, /elapsed/, /^time$/);
    const iNotes = find(/^notes?$/, /description/, /^name$/, /title/);
    if (iDate < 0) return { rows: [], warnings: ["Couldn't find a date column in this file."] };
    const distHead = iDist >= 0 ? head[iDist] : "";
    const miles = /\(mi|miles|\bmi\b/.test(distHead);
    const metres = /\(m\)|metres|meters/.test(distHead) && !/km/.test(distHead);
    if (iDist < 0) warnings.push("No distance column found, so distances are left blank.");
    const rows = [];
    for (const r of all.slice(1)) {
      const date = parseDateLoose(r[iDate], slashOrder);
      if (!date) continue;
      let km = iDist >= 0 ? num(r[iDist]) : null;
      if (km != null) { if (miles) km *= 1.609344; else if (metres) km /= 1000; km = Math.round(km * 100) / 100; if (km <= 0) km = null; }
      let min = null;
      if (iSec >= 0) { const s = num(r[iSec]); min = s != null ? Math.round(s / 6) / 10 : null; }
      else if (iDur >= 0) { const d = parseDuration(r[iDur]); min = d != null && isFinite(d) ? Math.round(d * 10) / 10 : null; }
      if (min != null && min <= 0) min = null;
      const rawAct = iAct >= 0 ? r[iAct] : "";
      rows.push({ date, activity: mapActivity(rawAct), km, min, notes: iNotes >= 0 ? String(r[iNotes] || "").trim().slice(0, 500) : "", raw: String(rawAct || "").trim().slice(0, 60) });
    }
    if (!rows.length) warnings.push("No rows had a date this app could read.");
    if (miles) warnings.push("Distances were in miles and have been converted to km.");
    return { rows, warnings };
  }
  function haversine(a, b) {
    const R = 6371.0088, toR = Math.PI / 180;
    const dLat = (b[0] - a[0]) * toR, dLon = (b[1] - a[1]) * toR;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * toR) * Math.cos(b[0] * toR) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(x)));
  }
  /* GPX from points [{lat,lon,time}] plus name/type text. */
  function summariseTrack(points, name, type) {
    let km = 0;
    for (let i = 1; i < points.length; i++) km += haversine([points[i - 1].lat, points[i - 1].lon], [points[i].lat, points[i].lon]);
    const times = points.map(p => p.time).filter(Boolean).map(t => Date.parse(t)).filter(t => !isNaN(t));
    const min = times.length > 1 ? Math.round((Math.max(...times) - Math.min(...times)) / 6000) / 10 : null;
    const date = times.length ? ymd(new Date(Math.min(...times))) : null;
    return { date, activity: mapActivity((type || "") + " " + (name || "")), km: km > 0 ? Math.round(km * 100) / 100 : null, min, notes: String(name || "").trim().slice(0, 500), raw: String(type || name || "GPX").slice(0, 60) };
  }
  function streaks(dates, today) {
    const set = new Set(dates);
    let cur = 0, d = set.has(today) ? today : addDays(today, -1);
    while (set.has(d)) { cur++; d = addDays(d, -1); }
    const sorted = [...set].filter(isYmd).sort(); let best = 0, run = 0, prev = null;
    for (const s of sorted) { run = prev && addDays(prev, 1) === s ? run + 1 : 1; best = Math.max(best, run); prev = s; }
    return { current: cur, best, loggedToday: set.has(today) };
  }
  /* Turn text read off a workout screenshot (on-device OCR) into a session.
     Handles MapMy-style stat blocks (numbers row, labels row) and "Label value" layouts. */
  function parseShotText(txt, today) {
    const lines = String(txt || "").split(/\r?\n/).map(l => l.replace(/[|_]/g, " ").replace(/\s+/g, " ").trim()).filter(Boolean);
    const all = lines.join("\n");
    let m, days_ago = null, date = null;
    if ((m = all.match(/(\d{1,3})\s*d(?:ays?)?\s*ago/i))) days_ago = +m[1];
    else if ((m = all.match(/(\d{1,2})\s*w(?:eeks?)?\s*ago/i))) days_ago = +m[1] * 7;
    else if (/yesterday/i.test(all)) days_ago = 1;
    else if (/(\d+)\s*(hours?|hrs?|h|minutes?|mins?)\s*ago|just now|\btoday\b/i.test(all)) days_ago = 0;
    else {
      m = all.match(/\b([A-Z][a-z]{2,8}\.?\s+\d{1,2},?\s+\d{4})\b/) || all.match(/\b(\d{1,2}\s+[A-Z][a-z]{2,8}\.?,?\s+\d{4})\b/) || all.match(/\b(\d{1,2}\/\d{1,2}\/\d{2,4})\b/) || all.match(/\b(\d{4}-\d{2}-\d{2})\b/);
      if (m) date = parseDateLoose(m[1], "dmy");
    }
    // activity: "Road Cycling - 9 days ago" style, else a line with an activity word
    let activity = "";
    m = all.match(/([A-Za-z][A-Za-z ]{2,40}?)\s*[-–—•·]\s*(?:\d+\s*(?:days?|weeks?|hours?|hrs?|minutes?|mins?)\s*ago|yesterday|today|just now)/i);
    if (m) activity = m[1].trim();
    if (!activity) { const l = lines.find(x => x.length < 40 && /(cycl|ride|biking|bike|run|jog|walk|hike|kayak|paddl|canoe|surfski|swim|row)/i.test(x) && !/mapmy/i.test(x)); if (l) activity = l.replace(/[^A-Za-z ]/g, " ").replace(/\s+/g, " ").trim(); }
    const unit = /\(\s*mi\s*\)|\bmiles?\b/i.test(all) && !/\(\s*km\s*\)|\bkm\b/i.test(all) ? "mi" : "km";

    const LABELS = [["distance", /distance|dist\b/i], ["speed", /avg\.?\s*speed|speed/i], ["duration", /duration|moving\s*time|elapsed|\btime\b/i], ["pace", /pace/i], ["calories", /calories|kcal/i]];

    const li = lines.findIndex(l => /distance|duration|avg\.?\s*speed/i.test(l));

      const nums = [];
      for (let j = li - 1; j >= Math.max(0, li - 4) && nums.length < order.length; j--) {
        const toks = lines[j].match(NUM) || [];
        const letters = lines[j].replace(/[^A-Za-z]/g, "").length;
        const looksLikeDate = /\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b|\d{4}/i.test(lines[j]);
        if (!toks.length || letters > 6 || looksLikeDate) { if (nums.length) break; continue; }
        nums.unshift(...toks);
      }
      if (nums.length >= order.length && order.length) {
        const vals = nums.slice(nums.length - order.length);
        order.forEach((o, k) => { if (o.name === "distance" && !/:/.test(vals[k])) km = parseFloat(vals[k].replace(",", ".")); if (o.name === "duration" && /:/.test(vals[k])) durText = vals[k]; });

</script>

<script>
/* ===== Standalone mode =====
   Outside Claude there is no shared database, so this stands in for it:
   each person's data is kept in their own browser on this device (localStorage).
   It mimics the small part of the store API the app uses. */
(function () {
  if (window.claude && typeof window.claude.use === "function") return; // running inside Claude: use the real platform
  const KEY = "exercise-tracker-data-v1";
  let store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch { store = {}; }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { console.warn("Couldn't save to this browser", e); } };
  const listeners = new Set();
  const notify = () => setTimeout(() => listeners.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }), 0);
  const clone = (v) => JSON.parse(JSON.stringify(v));
  const merge = (a, b) => { for (const [k, v] of Object.entries(b)) { if (v && typeof v === "object" && !Array.isArray(v) && a[k] && typeof a[k] === "object" && !Array.isArray(a[k])) merge(a[k], v); else a[k] = clone(v); } return a; };
  const meta = { fromCache: false, hasPendingWrites: false };
  const snapOf = (path) => { const id = path.split("/").pop(); const d = store[path]; return { id, exists: !!d, data: () => (d ? clone(d) : undefined), metadata: meta }; };
  const childrenOf = (col) => Object.keys(store).filter(p => p.startsWith(col + "/") && p.slice(col.length + 1).indexOf("/") === -1).sort();
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  function docRef(path) {
    return {
      id: path.split("/").pop(), path,
      get: async () => snapOf(path),
      set: async (data) => { store[path] = clone(data); persist(); notify(); },
      update: async (data) => { if (!store[path]) throw { code: "invalid_argument", message: "Document does not exist" }; merge(store[path], data); persist(); notify(); },
      delete: async () => { delete store[path]; persist(); notify(); },
      onSnapshot: (next) => { const fn = () => next(snapOf(path)); listeners.add(fn); setTimeout(fn, 0); return () => listeners.delete(fn); },
      collection: (sub) => colRef(path + "/" + sub),
    };
  }
  function query(col, n) {
    const run = () => { const docs = childrenOf(col).slice(0, n || undefined).map(snapOf); return { docs, size: docs.length, empty: !docs.length, metadata: meta, docChanges: () => [] }; };
    return {
      limit: (k) => query(col, k),
      get: async () => run(),
      onSnapshot: (next) => { const fn = () => next(run()); listeners.add(fn); setTimeout(fn, 0); return () => listeners.delete(fn); },
    };
  }
  function colRef(path) { return Object.assign(query(path), { path, doc: (id) => docRef(path + "/" + (id || newId())), add: async (data) => { const r = docRef(path + "/" + newId()); await r.set(data); return r; } }); }
  const db = { doc: docRef, collection: colRef };
  const user = { id: async () => "local", me: async () => ({ name: "" }), can: () => true, isOwner: () => true, canEdit: () => true, profiles: async () => ({}), search: async () => [] };
  window.STANDALONE = {
    exportJSON: () => JSON.stringify({ app: "exercise-tracker", version: 1, exportedAt: new Date().toISOString(), data: store }, null, 2),
    importJSON: (text) => { const o = JSON.parse(text); if (!o || o.app !== "exercise-tracker" || typeof o.data !== "object") throw new Error("Not an Exercise Tracker backup"); store = o.data; persist(); notify(); },
  };
  window.claude = { use: async (name) => (name === "db" ? db : name === "user" ? user : null) };
})();
</script>

<script>
(() => {
  const { ACTIVITIES: BUILTIN, ymd, parseYmd, addDays, isYmd, weekStart, periodRange, parseDuration, fmtDuration, fmtKm, pace, parseDateLoose, parseWorkoutCSV, summariseTrack, streaks } = window.ET;
  // ----- activity types: each person keeps their own list (name + colour) -----
  const PALETTE = ["ride", "paddle", "run", "walk", "swim", "gym", "other", "amber", "indigo", "red", "olive", "pink"];
  const COLOR_NAME = { ride: "Blue", paddle: "Cyan", run: "Orange", walk: "Brown", swim: "Purple", gym: "Magenta", other: "Grey", amber: "Gold", indigo: "Navy", red: "Red", olive: "Black", pink: "Pink" };
  const BUILTIN_COLOR = { Ride: "ride", Paddle: "paddle", Run: "run", Walk: "walk", Swim: "swim", Gym: "gym", Other: "other" };
  // Main exercises first: ocean paddling and riding
  const DEFAULT_TYPES = [
    { name: "Paddle ocean", color: "paddle" }, { name: "Ride", color: "ride" }, { name: "Paddle river", color: "indigo" },
    { name: "Walk", color: "run" }, { name: "Run", color: "red" }, { name: "Swim", color: "swim" }, { name: "Gym", color: "gym" }, { name: "Other", color: "other" }];
  const cleanTypeName = (s) => (typeof s === "string" ? s.replace(/[^\p{L}\p{N} &'\-]/gu, "").replace(/\s+/g, " ").trim().slice(0, 30) : "");

          r.fromShot ? h("td", null, h("input", { type: "text", class: "pnum", inputmode: "decimal", value: r.min != null ? minutesToForm(r.min) : "", placeholder: "1.25", "aria-label": "Time (hours.minutes or minutes)",

        h("button", { class: "btn sm", type: "button", onclick: () => { rows.forEach(r => { if (r.dup || r.batchDup) r.pick = false; }); ui.dupArmed = false; render(); } }, "untick duplicates")));

  function shotImportCard() {
    const card = h("div", { class: "card" }, h("h2", null, "Import from screenshots"),
      h("p", { style: "margin:0" }, window.STANDALONE ? "Pick one or more workout screenshots (MapMyRide, MapMyRun, MapMyWalk, Strava, Garmin and similar). The app reads the text on your phone and adds each one to the list below. Always check the distance, time and date before saving." : "Pick one or more workout screenshots (MapMy, Strava, Garmin and similar). Claude reads each one and adds it to the list below for you to check before saving."));
    if (!canWrite || !me) { card.append(h("div", { class: "notice" }, "You need edit access to import sessions.")); return card; }
    if (!canReadShots()) { card.append(h("div", { class: "notice" }, "Screenshot reading isn't available in this view. Open the app on claude.ai while signed in to use it.")); return card; }
    const S = ui.shotImp || (ui.shotImp = { busy: false, done: 0, total: 0, notes: [] });
    const input = h("input", { type: "file", accept: shotAccept(), multiple: true, class: "hidden", id: "shot-imp" });

      h("button", { class: "btn primary", type: "button", disabled: S.busy, onclick: () => input.click() }, S.busy ? `Reading ${Math.min(S.done + 1, S.total)} of ${S.total}…` : "Choose screenshots"),

  const SHOT_MAX = 10;
  async function runShotImport(files) {

        const r = await readShotData(file, S.ctl.signal, (m) => { S.status = m; render(); });
        S.status = "";

        else {
          const row = { app: r.app || "", date: r.date, activity: r.activity, km: r.km, min: r.min, notes: r.notes, raw: r.raw, fromShot: true, checkAll: !!r.checkAll, dateGuessed: r.dateGuessed, dateHint: r.dateGuessed ? r.dateNote.replace(/ (Check the date|Change it if needed)\.$/, "") : "", person: r.person, otherPerson: r.otherPerson };
          ui.importRows.unshift(row); markDups(ui.importRows, true);

        if (e && e.code === "cancelled") break;

      }

    }

  // Same session = same date and activity, distance within 0.1 km (or both blank),
  // and time within 2 minutes when both have a time.
  function sameSession(a, b) {
    if (a.date !== b.date || a.activity !== b.activity) return false;
    if ((a.km == null) !== (b.km == null)) return false;
    if (a.km != null && Math.abs(a.km - b.km) > 0.1) return false;
    if (a.min != null && b.min != null && Math.abs(a.min - b.min) > 2) return false;
    return true;
  }
  function findLogged(r, exceptId) { for (const [id, s] of mine()) if (id !== exceptId && sameSession(s, r)) return s; return null; }
  function isDup(r) { return !!findLogged(r); }
  const describe = (s) => `${s.activity}${s.km != null ? " " + fmtKm(s.km) + " km" : ""}${s.min != null ? " · " + fmtDuration(s.min) : ""} on ${fmtDay(s.date)}`;
  // Flag rows already in the app, and later rows that repeat an earlier row in the same import.
  function markDups(rows, keepPicks) {
    rows.forEach((r, i) => {
      const logged = findLogged(r);
      const twin = logged ? -1 : rows.findIndex((o, j) => j < i && sameSession(o, r));
      const was = r.dup || r.batchDup;
      r.dup = !!logged; r.dupOf = logged ? describe(logged) : ""; r.batchDup = twin >= 0;
      if (!keepPicks) r.pick = !r.dup && !r.batchDup && !r.otherPerson;
      else if (!was && (r.dup || r.batchDup)) r.pick = false; // newly found to be a duplicate

  }
  async function readFiles(files) {
    ui.lastFiles = files; ui.importWarnings = []; const out = [];
    for (const file of files.slice(0, 50)) {
      if (file.size > 20 * 1024 * 1024) { ui.importWarnings.push(`${file.name} is too large (over 20 MB).`); continue; }
      let text; try { text = await file.text(); } catch { ui.importWarnings.push(`Couldn't read ${file.name}.`); continue; }
      if (/\.gpx$/i.test(file.name) || /<gpx[\s>]/i.test(text.slice(0, 2000))) {
        try {
          const doc = new DOMParser().parseFromString(text, "application/xml");
          const pts = [...doc.getElementsByTagName("trkpt"), ...doc.getElementsByTagName("rtept")].map(p => ({ lat: parseFloat(p.getAttribute("lat")), lon: parseFloat(p.getAttribute("lon")), time: p.getElementsByTagName("time")[0]?.textContent || null })).filter(p => isFinite(p.lat) && isFinite(p.lon));
          const trk = doc.getElementsByTagName("trk")[0];
          const name = (trk && trk.getElementsByTagName("name")[0]?.textContent) || doc.getElementsByTagName("name")[0]?.textContent || "";
          const type = (trk && trk.getElementsByTagName("type")[0]?.textContent) || "";
          if (pts.length < 2) { ui.importWarnings.push(`${file.name} has no track points.`); continue; }
          const s = summariseTrack(pts, name, type);
          if (!s.date) { s.date = today(); ui.importWarnings.push(`${file.name} has no times, so its date is set to today. Change it after importing if needed.`); }
          out.push(s);
        } catch { ui.importWarnings.push(`${file.name} isn't a GPX file this app can read.`); }
      } else {
        const res = parseWorkoutCSV(text, ui.slashOrder);
        const fileApp = /map\s*my|mapmyfitness|mapmyride|mapmyrun|mapmywalk/i.test(text) ? "MapMy" : /strava/i.test(text) ? "Strava" : /garmin/i.test(text) ? "Garmin" : "";
        res.rows.forEach(x => { x.app = fileApp; });
        res.warnings.forEach(w => ui.importWarnings.push(`${file.name}: ${w}`));
        out.push(...res.rows);
      }
    }
    out.sort((a, b) => (a.date < b.date ? 1 : -1));
    const kept = ui.importRows.filter(r => r.fromShot);
    const fresh = out.map(r0 => ({ ...r0, activity: resolveType(r0.raw || r0.activity) }));
    ui.importRows = markDups(kept.concat(fresh), true);
    for (const r of ui.importRows.slice(kept.length)) r.pick = !r.dup && !r.batchDup;
    if (files.length && !out.length && !ui.importWarnings.length) ui.importWarnings.push("No sessions were found in that file.");
    render();
  }
  async function runImport(err, go) {
    if (ui.importing) return;
    const todo = ui.importRows.filter(r => r.pick);
    if (!todo.length) return;
    ui.importing = true; go.disabled = true;

    try {

        const body = cleanSession({ date: r.date, activity: r.activity, km: r.km, min: r.min, notes: r.notes, app: r.app || "", source: "import", createdAt: Date.now() });

          try { await col.doc().set(body); break; }
          catch (e) { if ((e && (e.code === "resource_exhausted" || e.code === "unavailable")) && tries++ < 4) { await new Promise(res => setTimeout(res, 1500 * tries)); continue; } throw e; }

        r.pick = false; r.dup = true; done++;

      }
      ui.importing = false;

      ui.importRows = ui.importRows.filter(r => !r.dup || r.pick);

    } catch (e) {
      ui.importing = false;
      err.textContent = `Stopped after ${done} of ${todo.length}. ${e && e.code === "quota_exceeded" ? "Storage is full." : "Try again to import the rest."}`;
      writeFailed(e); render();
    }
  }

  let resolving = false;
  async function resolveNames() {
    if (!user || resolving) return;
    const missing = [...members.keys()].filter(id => id !== me && !names.has(id));
    if (!missing.length) return;
    resolving = true;
    try { const ps = await user.profiles(missing); for (const id of missing) names.set(id, (ps && ps[id] && ps[id].name) || "Someone"); }
    catch { for (const id of missing) names.set(id, "Someone"); }
    resolving = false;
    if (view === "crew") scheduleRender();
  }

  // ---------- routing & start ----------
  const VIEWS = window.STANDALONE ? ["log", "stats", "goals", "import"] : ["log", "stats", "goals", "crew", "import"];
  function fromHash() { const v = location.hash.replace("#", ""); return VIEWS.includes(v) ? v : "log"; }

  async function start() {

      (async () => {

              if (!goals.some(g => g && (g.period === "week" || g.period === "day"))) goals.push({ id: "weekly15", activity: "All", metric: "wkm", period: "week", target: 15 });
              await ref.update({ dailyDefaulted: true, weeklyDefaulted: true, goals });
            }

      if (!me && !snap.metadata.fromCache) markReady();
      scheduleRender();
    }, () => { setStatus("Lost the connection. Reload the page to reconnect."); });
    render();
  }
